name: Solidity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: forge fmt --check
      - run: forge test -vvv
      - run: forge build